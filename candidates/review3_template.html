<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第三批动效审核</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1b1b1d; --mute:#6d6d73; --line:#e4e2dc; --chip:#efede8;
          --yes:#2f6b3a; --yes-soft:#e3efe2; --no:#a33a2c; --no-soft:#f6e3df; --warn:#8a6a1f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#141416; --panel:#1d1d20; --ink:#ececee; --mute:#9a9aa2; --line:#2e2e33; --chip:#26262b;
    --yes:#9fd38f; --yes-soft:#24331f; --no:#f0a093; --no-soft:#3a221e; --warn:#e0c27a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 24px 12px; }
  h1 { margin:0; font-size:21px; }
  .sub { color:var(--mute); font-size:13px; margin:2px 0 10px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid transparent; background:var(--chip); color:var(--ink); border-radius:6px; padding:3px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .chip.on { border-color:var(--ink); background:var(--panel); font-weight:600; }
  .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  .tally { margin-left:auto; font-size:13px; color:var(--mute); }
  .tally b { color:var(--yes); }
  .btn { border:0; background:var(--ink); color:var(--bg); border-radius:8px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  main { padding:18px 24px 80px; max-width:1280px; margin:0 auto; }
  h2 { font-size:17px; margin:28px 0 4px; font-weight:700; }
  h3 { font-size:14px; color:var(--mute); margin:16px 0 10px; font-weight:600; }
  .chip.small { font-size:12px; padding:2px 8px; }
  .tag.good { color:var(--yes); background:var(--yes-soft); }
  .tag.rough { color:var(--no); background:var(--no-soft); }
  .tag.lib { color:var(--bg); background:var(--ink); }
  .card.lib { border-style:dashed; }
  .review { font-size:12.5px; color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card.yes { border-color:var(--yes); }
  .card.no { opacity:.5; }
  .thumb { aspect-ratio:16/9; background:var(--chip); position:relative; display:block; }
  .thumb img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:13px; padding:12px; text-align:center; }
  .thumb.vid { aspect-ratio:9/16; background:#000; }
  .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .play { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.7); color:#fff; font-size:12px; padding:2px 8px; border-radius:5px; }
  .body { padding:10px 13px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .top { display:flex; align-items:baseline; gap:8px; }
  .num { font:600 13px ui-monospace,Menlo,monospace; color:var(--mute); }
  .name { font-weight:700; font-size:16px; }
  .diff { margin-left:auto; font-size:12px; padding:0 7px; border-radius:5px; background:var(--chip); white-space:nowrap; }
  .what { font-size:14px; }
  .use { font-size:13px; color:var(--mute); }
  .note { font-size:12.5px; color:var(--mute); background:var(--chip); border-radius:6px; padding:4px 8px; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag { font-size:11.5px; border-radius:4px; padding:0 6px; background:var(--chip); color:var(--mute); }
  .tag.warn { color:var(--warn); }
  .src { font-size:12.5px; display:flex; gap:8px; flex-wrap:wrap; }
  .src a { color:var(--mute); }
  .act { display:flex; gap:8px; margin-top:auto; padding-top:6px; }
  .act button { flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:6px; font:inherit; font-size:14px; cursor:pointer; }
  .card.yes .act .y { background:var(--yes-soft); border-color:var(--yes); color:var(--yes); font-weight:600; }
  .card.no .act .n { background:var(--no-soft); border-color:var(--no); color:var(--no); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:680px) { header{position:static;padding:12px 16px} main{padding:12px 16px 60px} .grid{grid-template-columns:1fr} .tally{margin-left:0;width:100%} }
</style>
<style>
  .frames { display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:2px; background:#000; }
  .frames img { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; cursor:zoom-in; }
  .frames.wide { grid-template-columns:1fr 1fr; }
  .frames.wide img { aspect-ratio:16/9; }
  .grid { grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .cmp { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--mute); background:var(--chip); border-radius:6px; padding:6px 8px; }
  .cmp img { width:44px; aspect-ratio:9/16; object-fit:cover; border-radius:4px; flex:none; }
  .sug { font-size:12.5px; color:var(--warn); font-weight:600; }
  dialog { border:0; padding:0; background:transparent; max-width:92vw; max-height:92vh; }
  dialog img { max-width:92vw; max-height:92vh; display:block; }
  dialog::backdrop { background:rgba(0,0,0,.8); }
  @media (max-width:600px) { header, main { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<header>
  <h1>第三批动效审核</h1>
  <div class="sub">按四种风格找了 10 条爆款口播，拆出 25 个库里没有的动效。<b>还没做演示</b>，图是原视频截帧（点开看大图），下面一行是库里最像的那个和区别。你先勾「要 / 不要」，只把要的做成演示，省时间。选完点「复制结果」发给我；选择存在这个浏览器里。</div>
  <div class="bar" id="bar"></div>
</header>
<main id="main"></main>
<dialog id="dlg"><img id="big" alt=""></dialog>
<script>
const DATA = /*DATA*/[];
const KEY = 'review3';
let pick = {};
try { pick = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);
const STYLES = ['全部', '简洁商务', '科技感', '电影感', '网感活泼'];
let view = '全部';

function bar() {
  const yes = DATA.filter(c => pick[c.n] === 'y').length, no = DATA.filter(c => pick[c.n] === 'n').length;
  $('#bar').innerHTML = STYLES.map(s => `<button class="chip ${s === view ? 'on' : ''}" data-s="${s}">${s}</button>`).join('') +
    `<span class="tally">要 <b>${yes}</b> · 不要 ${no} · 未选 ${DATA.length - yes - no}</span><button class="btn" id="copy">复制结果</button>`;
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { view = b.dataset.s; draw(); });
  $('#copy').onclick = copy;
}

function card(c) {
  const st = pick[c.n] === 'y' ? 'yes' : pick[c.n] === 'n' ? 'no' : '';
  return `<div class="card ${st}" data-n="${c.n}">
    <div class="frames">${c.frames.map(f => `<img src="${f}" alt="">`).join('')}</div>
    <div class="body">
      <div class="top"><span class="num">#${c.n}</span><span class="name">${esc(c.name)}</span><span class="diff">${esc(c.diff)}</span></div>
      <div class="tags">${c.style.map(s => `<span class="tag">${esc(s)}</span>`).join('')}${c.needs.map(x => `<span class="tag warn">要上传${esc(x)}</span>`).join('')}</div>
      ${c.note ? `<div class="sug">💡 ${esc(c.note)}</div>` : ''}
      <div class="what">${esc(c.what)}</div>
      <div class="use">用在：${esc(c.use)}</div>
      <div class="cmp">${c.lib_img ? `<img src="${c.lib_img}" alt="">` : ''}<div>库里最像：${c.lib_name ? `<b>${esc(c.lib_name)}</b> · ` : ''}${esc(c.closest)}</div></div>
      <div class="src"><a href="${esc(c.src)}" target="_blank" rel="noopener">来源：${esc(c.video)}</a></div>
      <div class="act"><button class="y">要</button><button class="n">不要</button></div>
    </div></div>`;
}

function draw() {
  bar();
  const list = DATA.filter(c => view === '全部' || c.style[0] === view);
  const groups = [...new Set(list.map(c => c.style[0]))];
  $('#main').innerHTML = groups.map(g => {
    const cs = list.filter(c => c.style[0] === g);
    return `<h2>${esc(g)} <span class="num">${cs.length}</span></h2><div class="grid">${cs.map(card).join('')}</div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(el => {
    const n = el.dataset.n;
    el.querySelector('.y').onclick = () => { pick[n] = pick[n] === 'y' ? undefined : 'y'; save(); draw(); };
    el.querySelector('.n').onclick = () => { pick[n] = pick[n] === 'n' ? undefined : 'n'; save(); draw(); };
    el.querySelectorAll('.frames img').forEach(im => {
      if (im.naturalWidth > im.naturalHeight) im.parentElement.classList.add('wide');
      im.onload = () => { if (im.naturalWidth > im.naturalHeight) im.parentElement.classList.add('wide'); };
      im.onclick = () => { $('#big').src = im.src; $('#dlg').showModal(); };
    });
  });
}
$('#dlg').onclick = () => $('#dlg').close();

async function copy() {
  const yes = DATA.filter(c => pick[c.n] === 'y'), no = DATA.filter(c => pick[c.n] === 'n');
  const txt = `第三批 要（${yes.length}）：${yes.map(c => `#${c.n} ${c.name}`).join('、') || '无'}\n不要（${no.length}）：${no.map(c => '#' + c.n).join(' ') || '无'}`;
  try { await navigator.clipboard.writeText(txt); $('#copy').textContent = '已复制'; }
  catch (e) { prompt('复制下面这段发给我', txt); }
  setTimeout(() => { const b = $('#copy'); if (b) b.textContent = '复制结果'; }, 1500);
}
draw();
</script>
</body>
</html>
