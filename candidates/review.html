<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选动效审核</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1b1b1d; --mute:#6d6d73; --line:#e4e2dc; --chip:#efede8;
          --yes:#2f6b3a; --yes-soft:#e3efe2; --no:#a33a2c; --no-soft:#f6e3df; --warn:#8a6a1f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#141416; --panel:#1d1d20; --ink:#ececee; --mute:#9a9aa2; --line:#2e2e33; --chip:#26262b;
    --yes:#9fd38f; --yes-soft:#24331f; --no:#f0a093; --no-soft:#3a221e; --warn:#e0c27a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 24px 12px; }
  h1 { margin:0; font-size:21px; }
  .sub { color:var(--mute); font-size:13px; margin:2px 0 10px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid transparent; background:var(--chip); color:var(--ink); border-radius:6px; padding:3px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .chip.on { border-color:var(--ink); background:var(--panel); font-weight:600; }
  .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  .tally { margin-left:auto; font-size:13px; color:var(--mute); }
  .tally b { color:var(--yes); }
  .btn { border:0; background:var(--ink); color:var(--bg); border-radius:8px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  main { padding:18px 24px 80px; max-width:1280px; margin:0 auto; }
  h2 { font-size:15px; color:var(--mute); margin:22px 0 10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card.yes { border-color:var(--yes); }
  .card.no { opacity:.5; }
  .thumb { aspect-ratio:16/9; background:var(--chip); position:relative; display:block; }
  .thumb img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:13px; padding:12px; text-align:center; }
  .thumb.vid { aspect-ratio:9/16; background:#000; }
  .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .play { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.7); color:#fff; font-size:12px; padding:2px 8px; border-radius:5px; }
  .body { padding:10px 13px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .top { display:flex; align-items:baseline; gap:8px; }
  .num { font:600 13px ui-monospace,Menlo,monospace; color:var(--mute); }
  .name { font-weight:700; font-size:16px; }
  .diff { margin-left:auto; font-size:12px; padding:0 7px; border-radius:5px; background:var(--chip); white-space:nowrap; }
  .what { font-size:14px; }
  .use { font-size:13px; color:var(--mute); }
  .note { font-size:12.5px; color:var(--mute); background:var(--chip); border-radius:6px; padding:4px 8px; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag { font-size:11.5px; border-radius:4px; padding:0 6px; background:var(--chip); color:var(--mute); }
  .tag.warn { color:var(--warn); }
  .src { font-size:12.5px; display:flex; gap:8px; flex-wrap:wrap; }
  .src a { color:var(--mute); }
  .act { display:flex; gap:8px; margin-top:auto; padding-top:6px; }
  .act button { flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:6px; font:inherit; font-size:14px; cursor:pointer; }
  .card.yes .act .y { background:var(--yes-soft); border-color:var(--yes); color:var(--yes); font-weight:600; }
  .card.no .act .n { background:var(--no-soft); border-color:var(--no); color:var(--no); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:680px) { header{position:static;padding:12px 16px} main{padding:12px 16px 60px} .grid{grid-template-columns:1fr} .tally{margin-left:0;width:100%} }
</style>
</head>
<body>
<header>
  <h1>候选动效审核</h1>
  <div class="sub">网上三路找来 98 条，合并重复、去掉库里已有的，剩 <span id="total"></span> 条。每条都是我们用同一段口播做的快速演示，鼠标放上去播放；想看原出处点下面的来源链接。每条点「要」或「不要」，选完点「复制结果」发给我。选择会自动保存在这个浏览器里。</div>
  <div class="bar" id="cats"></div>
  <div class="bar" style="margin-top:8px">
    <span id="views"></span>
    <span class="tally" id="tally"></span>
    <button class="btn ghost" id="reset">清空选择</button>
    <button class="btn" id="copy">复制结果</button>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

sources": ["https://gotranscript.com/public/mastering-youtube-shorts-capcut-tutorial-for-ali-abdaal-alex-hormozi-and-cody-sanchez-styles"], "note": "Hormozi 风格"}, {"n": 24, "id": "c24", "name": "头顶光环", "category": "素材", "what": "一个手绘光环出现并漂在人头顶上，跟着人动", "use": "讲「光环效应」这类概念、反讽「圣人」时刻", "needs": ["抠像", "图片"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=BLVXMAdHZ8k"], "note": "适用面窄"}, {"n": 25, "id": "c25", "name": "漫画对白气泡", "category": "素材", "what": "漫画样式的对话框/思考泡或爆炸字（「WHAT?!」）带网点，从人头旁边弹出", "use": "内心独白、反讽、反应、复述别人说的话", "needs": ["音效"], "difficulty": "easy", "sources": ["https://elements.envato.com/comic-elements-VRHJEWX"], "note": "", "img": "https://elements-resized.envatousercontent.com/elements-video-cover-images/files/239956301/590.jpg?w=1200&h=630&cf_fit=crop&q=85&format=jpeg&s=123a57e875e40260b9128eaadb8d9fef0f89cb66e11e233294d5d71f2595e97e"}, {"n": 26, "id": "c26", "name": "表情包弹出", "category": "素材", "what": "大号表情（😂😱🔥）在说到对应的词时弹到脸旁，或者像直播一样往上飘", "use": "玩笑、情绪词、轻量强调", "needs": ["音效"], "difficulty": "easy", "sources": ["https://motionarray.com/stock-motion-graphics/facebook-emoji-reactions-vertical-pack-842485/"], "note": "", "img": "https://motionarray.com/assets/images/shared/logo--cyan_2x.png?v=1"}, {"n": 27, "id": "c27", "name": "复古电视框", "category": "素材", "what": "一段截图/视频装进老式显像管电视里播放，背景做旧，电视上压大字，慢慢推近", "use": "提到某个内容/媒体、怀旧、引用网上看到的东西", "needs": ["图片", "视频"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=q-qbKk8Qams&t=1118s"], "note": ""}, {"n": 28, "id": "c28", "name": "红线线索墙", "category": "素材", "what": "几张截图散在屏幕上，红线把它们连起来，中间清楚、四周虚化，偏暖色", "use": "串证据、「大家都在做 X」、揭秘调查的语气", "needs": ["图片"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=q-qbKk8Qams&t=1330s"], "note": ""}, {"n": 29, "id": "c29", "name": "素材环形阵列", "category": "素材", "what": "很多小圆角卡片（截图/B-roll）一张张弹出，围着中间的标题排成一圈，然后镜头拉远", "use": "讲坚持/数量「连发 30 天」、很多结果一起展示", "needs": ["视频", "图片"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=MNG51L8ikQw&t=601s"], "note": ""}, {"n": 30, "id": "c30", "name": "快闪连拍", "category": "素材", "what": "同一个构图的四个不同画面（不同衣服/场景），每个只有几帧，在标题后面的圆角框里快速循环闪", "use": "开场点名「做剪辑的你……」、表示「例子很多」", "needs": ["视频", "图片"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=MNG51L8ikQw&t=292s"], "note": ""}, {"n": 31, "id": "c31", "name": "纸片展开图形", "category": "素材", "what": "扁平的剪纸插画和纸片字母一步步翻开、展开，出现在人旁边", "use": "人名标题、用亲切的方式讲概念", "needs": ["图片"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=sIkWwafmrlM"], "note": "Ali Abdaal 招牌"}, {"n": 32, "id": "c32", "name": "极简线稿隐喻", "category": "素材", "what": "纯深色背景上，简单的单色线稿把正在说的比喻画出来（比如冰山在水里晃），插在口播中间", "use": "抽象概念、比喻、哲理/成长类观点", "needs": ["图片"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=axE3Z_dYWfc"], "note": "Dan Koe 风格；每次要画新的线稿"}, {"n": 33, "id": "c33", "name": "地图描线", "category": "素材", "what": "一张有质感的地图铺满屏幕慢慢移动，一条线自己画出路线，终点弹出地名", "use": "讲地点、出行、扩张、讲故事", "needs": ["图片"], "difficulty": "medium", "sources": ["https://aescripts.com/learn/how-johnny-harris-makes-maps/"], "note": "Johnny Harris 招牌；来源的具体做法只看了搜索摘要"}, {"n": 34, "id": "c34", "name": "质感旋钮仪表", "category": "素材", "what": "深色颗粒背景上一个带立体感的旋钮，放大出现，指针转到某一档，刻度跟着亮", "use": "「调高/调低」某样东西、表示程度、风险", "needs": ["数字"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=EehfkRZXq6o"], "note": "Iman Gadzhi 风格；适用面窄"}, {"n": 35, "id": "c35", "name": "物体碎裂", "category": "素材", "what": "一个 3D 物体（手机）从旁边转进来，接着碎成玻璃渣飞散", "use": "「千万别这样做」、辟谣、强烈的负面观点", "needs": ["图片", "音效"], "difficulty": "hard", "sources": ["https://www.youtube.com/watch?v=Qbntd8yud0o&t=535s"], "note": "网页里做 3D 碎裂比较难"}, {"n": 36, "id": "c36", "name": "上下分屏", "category": "版式", "what": "竖屏上下一分为二：一半是人，另一半放 B-roll/对比图，从两边滑进来，中间可以压字幕", "use": "对比（之前/之后、对/错）、边讲边给例子", "needs": ["视频", "图片"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=A0vzIQlaPX0&t=205s", "https://www.youtube.com/watch?v=wkWkHwFKcNE", "https://elements.envato.com/vertical-multiscreen-before-after-KCT47XG"], "note": "三路都找到了，很常见"}, {"n": 37, "id": "c37", "name": "侧屏滑入", "category": "版式", "what": "另一块画面（B-roll、截图或文字卡）从一侧滑进来，人同时往另一侧滑，最后各占半边，人不缩小", "use": "对比、边讲边补充一个画面、换话题", "needs": ["图片", "视频"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=YUvG0hzwTsg&t=426s"], "note": ""}, {"n": 38, "id": "c38", "name": "画中画弹窗", "category": "版式", "what": "人保持全屏，角落或上方弹开一个带阴影的圆角卡片放 B-roll/图片，过一会儿收起", "use": "边讲边给一个例子/证据、提到某个产品", "needs": ["视频", "图片"], "difficulty": "easy", "sources": ["https://motionarray.com/davinci-resolve-macros/pop-up-effect-macro-978376/"], "note": "", "img": "https://motionarray.com/assets/images/shared/logo--cyan_2x.png?v=1"}, {"n": 39, "id": "c39", "name": "清单打勾", "category": "版式", "what": "人往一边让开，一张清单卡滑进来，说到哪条，哪条就打个勾（或红叉），字变亮", "use": "列步骤/技巧、误区 vs 事实、「这几件你做了吗」", "needs": ["音效"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=aNwKDaTag2Q&t=498s", "https://elements.envato.com/checkbox-list-constructor-ABASNAE"], "note": "两路都找到了"}, {"n": 40, "id": "c40", "name": "报纸底清单", "category": "版式", "what": "背景是反色（变暗）的旧报纸慢慢漂移，清单条目带小图一条条弹出", "use": "列举（3 个理由 / 5 个技巧）", "needs": ["图片"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=5FtsVft5Vn8"], "note": "Ali Abdaal 风格；和「清单打勾」是同一用途的另一种样子"}, {"n": 41, "id": "c41", "name": "白卡图标环绕", "category": "版式", "what": "几张白色圆角小卡（图标 + 一行字）一张张弹到人四周的角落，不挡脸", "use": "列举几样东西/工具、总结几个选项", "needs": ["图片"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=YWoWti-hSo0"], "note": "Ali Abdaal 风格"}, {"n": 42, "id": "c42", "name": "三联屏", "category": "版式", "what": "屏幕分成三格，每格是人的不同画面；谁在说话谁亮，说完的那格定住变暗", "use": "讲三个点、三个版本（问题 / 错误 / 解决）", "needs": ["视频"], "difficulty": "medium", "sources": ["https://www.douyin.com/video/7602177171734344522"], "note": "抖音口播常见"}, {"n": 43, "id": "c43", "name": "左右轮换图文", "category": "版式", "what": "抠出的人站在左或右三分之一，另外三分之二放图/图表；每 4–6 秒换图，人换边站", "use": "图多的讲解、数据和对比", "needs": ["抠像", "图片"], "difficulty": "medium", "sources": ["http  ""}, {"n": 49, "id": "c49", "name": "进度条", "category": "版式", "what": "底部或顶部一条进度条：整条视频从左到右慢慢填满，或者分成几段、讲到第几步亮到第几段", "use": "长一点的视频、多步骤教程，让人看到最后", "needs": [], "difficulty": "easy", "sources": ["https://www.kapwing.com/resources/how-to-make-videos-like-garyvee/", "https://elements.envato.com/multi-step-progress-bars-GTG4ATT"], "note": "GaryVee 在用"}, {"n": 50, "id": "c50", "name": "震屏冲击", "category": "镜头特效", "what": "整个画面猛地抖几下再迅速停住（0.3–0.6 秒），踩在重音或音效上", "use": "重音词、吐槽、「砰」、爆出一个惊人数字", "needs": ["音效"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=VQsna0Y4EPc&t=535s", "https://elements.envato.com/camera-shake-presets-for-premiere-pro-8E7CHZR"], "note": "两路都找到了"}, {"n": 51, "id": "c51", "name": "急推回弹", "category": "镜头特效", "what": "镜头快速推到脸上，停一拍，再缓缓退回原来的景别（一次进出，不是慢推）", "use": "强调一个词、抖包袱、惊讶", "needs": ["音效"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=YUvG0hzwTsg&t=571s"], "note": "和已有的「推近」不同：这个快、会回来"}, {"n": 52, "id": "c52", "name": "手持晃动", "category": "镜头特效", "what": "整个画面加一点点随机晃动和旋转，三脚架拍的画面看起来像手持，更有生气", "use": "开场、高能的句子、太静的段落打断一下", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=YUvG0hzwTsg&t=550s"], "note": ""}, {"n": 53, "id": "c53", "name": "景别跳切", "category": "镜头特效", "what": "每次剪切在原景别和放大 120–150% 的脸部特写之间来回切，假装有第二台机位", "use": "任何剪切点；重的话切特写，轻松的话切回全景", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=xCl_zqJdjAc&t=437s"], "note": "我们粗剪里已经有轻量版（1.0 / 1.08 交替），这个是幅度更大的版本"}, {"n": 54, "id": "c54", "name": "局部留色", "category": "镜头特效", "what": "画面变黑白，只留一样东西有颜色：人、手里的道具，或字幕里的关键词", "use": "整条片子的风格、只想让一样东西抢眼的时候", "needs": ["抠像"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=A0vzIQlaPX0&t=431s", "https://www.choppity.com/tools/recreate-video-editing-style/ali-abdaal/"], "note": "Ali Abdaal 风格"}, {"n": 55, "id": "c55", "name": "聚光灯", "category": "镜头特效", "what": "画面压到接近全黑，一束柔和的圆形光打在人（或指着的东西）上，像舞台", "use": "坦白、揭晓真相「真正的原因是……」、情绪高点", "needs": [], "difficulty": ficulty": "medium", "sources": ["https://www.douyin.com/video/7597003199622674425"], "note": "要对准手势的时间点"}, {"n": 61, "id": "c61", "name": "失焦入场", "category": "镜头特效", "what": "画面一开始雾蒙蒙、很糊、稍微放大，然后慢慢变清楚，人「对上焦」", "use": "开场第一个镜头、从 B-roll 切回来、走心的开头", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=q-qbKk8Qams&t=584s"], "note": ""}, {"n": 62, "id": "c62", "name": "胶片卡顿颗粒", "category": "镜头特效", "what": "画面掉到很低的帧率（一卡一卡像定格动画），再叠一层跳动的胶片颗粒", "use": "复古/怀旧的故事、需要质感的标题段", "needs": [], "difficulty": "easy", "sources": ["https://gotranscript.com/public/mastering-youtube-shorts-capcut-tutorial-for-ali-abdaal-alex-hormozi-and-cody-sanchez-styles"], "note": ""}, {"n": 63, "id": "c63", "name": "撕纸转场", "category": "转场", "what": "当前画面沿着锯齿状的纸边撕开（白色纸纤维边 + 阴影），露出下面的新画面", "use": "换话题、「第二部分」、前后对比揭晓", "needs": ["音效"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=A0vzIQlaPX0&t=123s", "https://elements.envato.com/paperflow-vertical-handcrafted-paper-texture-trans-7EZ6N65"], "note": "两路都找到了"}, {"n": 64, "id": "c64", "name": "撕纸边画面", "category": "转场", "what": "一段 B-roll 或口播装在一张撕边纸片里（带投影），从纸面/彩色背景上滑进来", "use": "引出一个例子或小故事、换话题", "needs": ["图片", "视频"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=5FtsVft5Vn8"], "note": "Ali Abdaal 风格"}, {"n": 65, "id": "c65", "name": "纸团展开", "category": "转场", "what": "一个揉皱的纸团展开铺满屏幕，下一张图/画面出现在展平的纸上，配纸张声", "use": "换话题、揭晓答案或下一个点", "needs": ["音效"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=5FtsVft5Vn8", "https://www.youtube.com/watch?v=wxlDksHicW8"], "note": "Ali Abdaal 招牌"}, {"n": 66, "id": "c66", "name": "标题幕下滑", "category": "转场", "what": "一张全屏背景卡从上往下滑下来盖住人，卡上写段落标题，过一会儿滑走露出人", "use": "章节/话题切换、下一个要点", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=YUvG0hzwTsg&t=664s"], "note": ""}, {"n": 67, "id": "c67", "name": "变焦模糊转场", "category": "转场", "what": "画面猛地往中间冲、带强烈的放射模糊，下一个画面从模糊里冲出来对上焦", "use": "换话题、有劲地跳到下一个点、切 B-roll", "needs": ["音效"], "difficulty": "medium", "sources": ["https://elements.envato.com/massive-camera-transitions-GZ6LFV9"], "note": "", "img": "https://elements-resized.envatousercontent.com/elements-video-cover-images/files/462101513/Massive%20Camera%20Transitions%20PREMIERE%202560x1440%20Preview.jpg?w=1200&h=630&cf_fit=crop&q=85&format=jpeg&s=e99cbbff99032232dc52b23ed7ba5278916d673d2bac8f0c855fa2bd1da6a7fd"}, {"n": 68, "id": "c68", "name": "鱼眼拉远", "category": "转场", "what": "画面一开始像鱼眼一样鼓起来，然后快速变平并拉远，先快后慢", "use": "揭开新场景、进入动画段、能量拉满", "needs": ["音效"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=HQvV75kjblY&t=492s"], "note": ""}, {"n": 69, "id": "c69", "name": "漏光闪白", "category": "转场", "what": "一道暖橙色/白色的光扫过画面，短暂过曝到接近全白，光过去时新画面出现", "use": "柔和地换话题、回忆、「那一刻我意识到……」", "needs": [], "difficulty": "easy", "sources": ["https://elements.envato.com/light-transitions-7LW89AX"], "note": "", "img": "https://elements-resized.envatousercontent.com/elements-video-cover-images/files/545234635/2.0.jpg?w=1200&h=630&cf_fit=crop&q=85&format=jpeg&s=4d095344379ad983c8fe08dd5bf6c8c65916550d3b191a4cea63243ca011c36e"}, {"n": 70, "id": "c70", "name": "快门闪白", "category": "转场", "what": "一下白闪加轻微抖动和「咔嚓」快门声，画面在闪的瞬间切走，像刚拍了张照", "use": "引出一张照片/证据、干脆地跳到新的点", "needs": ["音效"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=Ik2qnqfaPpg"], "note": "Johnny Harris 风格"}, {"n": 71, "id": "c71", "name": "光扫转场", "category": "转场", "what": "一道很亮的斜向光从整个画面扫过（连字幕一起扫），画面在光下面换掉", "use": "换话题、从开场进入正文", "needs": [], "difficulty": "easy", "sources": ["https://gotranscript.com/public/mastering-youtube-shorts-capcut-tutorial-for-ali-abdaal-alex-hormozi-and-cody-sanchez-styles"], "note": "Codie Sanchez 风格"}, {"n": 72, "id": "c72", "name": "圆形扩散揭示", "category": "转场", "what": "新画面透过一个从 0 慢慢长到全屏的圆形出现，像光圈打开", "use": "揭示一个例子、开始讲故事、给出答案", "needs": ["图片"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=VQsna0Y4EPc&t=111s"], "note": ""}, {"n": 73, "id": "c73", "name": "开幕分屏", "category": "转场", "what": "当前画面分成两三条，像幕布一样往两边拉开，露出下面的新画面或标题", "use": "换话题、大揭晓、段落开头", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=aULMmeQFqxk"], "note": "来源只看了标题"}, {"n": 74, "id": "c74", "name": "标题匹配切", "category": "转场", "what": "一串不同的文章截图快速切换，同一个词（如「通胀」）一直固定在屏幕同一个位置，周围的文章每次都变", "use": "表示「所有人都在讲 X」、开场制造紧迫感", "needs": ["图片"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=fQX20G0gxMs"], "note": "Vox / Johnny Harris 风格；素材准备量大"}, {"n": 75, "id": "c75", "name": "MVP结算转场", "category": "转场", "what": "画面镜像并斜 -9°，蒙版放大铺满再猛地缩小，抠出的人弹到前面，文字带循环扫光，踩音乐重拍", "use": "庆祝成果、铺垫后的高潮", "needs": ["抠像", "音效"], "difficulty": "medium", "sources": ["https://www.douyin.com/shipin/7569409145187797030"], "note": "抖音口播常见"}, {"n": 76, "id": "c76", "name": "定格人物介绍", "category": "片头片尾", "what": "画面定格，背景虚化压暗，抠出的人加描边放大挪到一边，笔刷贴纸滑进来写上名字/身份，配打字声或嗖声", "use": "自我介绍、介绍嘉宾、综艺感出场", "needs": ["抠像", "音效"], "difficulty": "easy", "sources": ["https://www.douyin.com/video/7620297661396176137", "https://www.youtube.com/watch?v=W79u8d2VpVA&t=38s"], "note": "两路都找到了，抖音口播常见"}, {"n": 77, "id": "c77", "name": "定格快门", "category": "片头片尾", "what": "在节拍点上画面白闪 + 快门声定格，像一张照片停一秒（常配抠像 + 一行字），然后继续播放", "use": "开场钩子、「这是当时的我」、关键句前的停顿", "needs": ["音效"], "difficulty": "easy", "sources": ["https://www.douyin.com/shipin/7642894718157899839", "https://www.kapwing.com/resources/how-to-make-videos-like-garyvee/"], "note": "GaryVee 也用（定格 + 品牌音）"}, {"n": 78, "id": "c78", "name": "电影黑边拉开", "category": "片头片尾", "what": "画面从全黑开始，上下两条黑边往外拉开露出画面，停在宽银幕比例，黑边上可以放标题", "use": "讲故事模式「给你讲个故事」、严肃/戏剧化的开场或结尾", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=ruIomvLW_AY", "https://www.choppity.com/tools/recreate-video-editing-style/tom-noske/"], "note": ""}, {"n": 79, "id": "c79", "name": "光标点关注", "category": "片头片尾", "what": "一个「关注/点赞」按钮弹出，鼠标或手指滑过来点一下，按钮变成「已关注」或变红，炸一下消失", "use": "中途或结尾的行动号召「关注看下集」", "needs": ["音效"], "difficulty": "easy", "sources": ["https://elements.envato.com/subscribe-elements-YZPLXTK"], "note": "", "img": "https://elements-resized.envatousercontent.com/elements-video-cover-images/files/677984047/Preview%202K.png?w=1200&h=630&cf_fit=crop&q=85&format=jpeg&s=c5d855a76b8ecf61d467614a32016ba549078808e32da814e8008239a1563aba"}];
const DIFF = { easy: '容易', medium: '中等', hard: '难' };
const CATS = ['全部', '字体', '素材', '版式', '镜头特效', '转场', '片头片尾'];
const VIEWS = [['all', '全部'], ['todo', '未选'], ['yes', '要'], ['no', '不要']];
const KEY = 'motion-review-1028';
let pick = {};
try { pick = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) {} };
const st = { cat: '全部', view: 'all' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('#total').textContent = DATA.length;

function ytId(u) { const m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/); return m && m[1]; }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, '').replace('elements.envato.com', 'Envato').replace('youtube.com', 'YouTube').replace('douyin.com', '抖音'); } catch (e) { return '链接'; } }
function thumb(c) {
  if (c.preview) return `<div class="thumb vid"><video muted loop playsinline preload="none" poster="${esc(c.poster || '')}" data-src="${esc(c.preview)}"></video><span class="play">我们做的演示 · 悬停播放</span></div>`;
  const y = c.sources.map(ytId).find(Boolean);
  const first = c.sources[0];
  if (y) {
    const u = c.sources.find(s => ytId(s) === y);
    const t = (u.match(/[?&]t=(\d+)/) || [])[1];
    return `<a class="thumb" href="${esc(u)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${y}/mqdefault.jpg" loading="lazy" alt="">
      <span class="play">▶ ${t ? Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') + ' 起' : 'YouTube'}</span></a>`;
  }
  if (c.img) return `<a class="thumb" href="${esc(first)}" target="_blank" rel="noopener"><img src="${esc(c.img)}" loading="lazy" alt="" referrerpolicy="no-referrer"
      onerror="this.remove()"><span class="ph" style="z-index:-1">点这里打开 ${esc(host(first))}</span><span class="play">${esc(host(first))}</span></a>`;
  return `<a class="thumb" href="${esc(first)}" target="_blank" rel="noopener"><span class="ph">没有缩略图<br>点这里打开 ${esc(host(first))}</span></a>`;
}
function card(c) {
  const p = pick[c.n] || '';
  const weak = /来源只|只看了|只看到|第三方/.test(c.note);
  return `<div class="card ${p}" data-n="${c.n}">
    ${thumb(c)}
    <div class="body">
      <div class="top"><span class="num">#${c.n}</span><span class="name">${esc(c.name)}</span><span class="diff">${DIFF[c.difficulty]}</span></div>
      <div class="what">${esc(c.what)}</div>
      <div class="use">适合：${esc(c.use)}</div>
      <div class="tags"><span class="tag">${esc(c.category)}</span>${c.needs.map(x => `<span class="tag">要${esc(x)}</span>`).join('')}${weak ? '<span class="tag warn">⚠️ 来源较弱</span>' : ''}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
      <div class="src">${c.sources.map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener">来源${i + 1} · ${esc(host(s))}</a>`).join('')}</div>
      <div class="act"><button class="y">要</button><button class="n">不要</button></div>
    </div></div>`;
}
function draw() {
  $('#cats').innerHTML = CATS.map(c => {
    const n = c === '全部' ? DATA.length : DATA.filter(x => x.category === c).length;
    return `<button class="chip ${st.cat === c ? 'on' : ''}" data-cat="${c}">${c} ${n}</button>`;
  }).join('');
  $('#views').innerHTML = VIEWS.map(([k, l]) => `<button class="chip ${st.view === k ? 'on' : ''}" data-view="${k}">${l}</button>`).join(' ');
  const yes = DATA.filter(c => pick[c.n] === 'yes').length, no = DATA.filter(c => pick[c.n] === 'no').length;
  $('#tally').innerHTML = `要 <b>${yes}</b> · 不要 ${no} · 未选 ${DATA.length - yes - no}`;
  const list = DATA.filter(c => (st.cat === '全部' || c.category === st.cat) &&
    (st.view === 'all' || (st.view === 'todo' ? !pick[c.n] : pick[c.n] === st.view)));
  const cats = CATS.slice(1).filter(k => list.some(c => c.category === k));
  $('#main').innerHTML = cats.map(k => `<h2>${k}</h2><div class="grid">${list.filter(c => c.category === k).map(card).join('')}</div>`).join('')
    || '<p style="color:var(--mute)">这里没有条目。</p>';
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.cat) { st.cat = b.dataset.cat; draw(); return; }
  if (b.dataset.view) { st.view = b.dataset.view; draw(); return; }
  const cardEl = b.closest('.card');
  if (cardEl && (b.classList.contains('y') || b.classList.contains('n'))) {
    const n = cardEl.dataset.n, v = b.classList.contains('y') ? 'yes' : 'no';
    pick[n] = pick[n] === v ? undefined : v; if (!pick[n]) delete pick[n];
    save(); draw();
  }
});
document.addEventListener('mouseover', ev => {
  const t = ev.target.closest('.thumb.vid'); if (!t) return;
  const v = t.querySelector('video'); if (!v.src) v.src = v.dataset.src; v.play().catch(() => {});
});
document.addEventListener('mouseout', ev => {
  const t = ev.target.closest('.thumb.vid'); if (!t || t.contains(ev.relatedTarget)) return;
  t.querySelector('video').pause();
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('.thumb.vid'); if (!t) return;
  const v = t.querySelector('video'); if (!v.src) v.src = v.dataset.src; v.muted = false; v.paused ? v.play() : v.pause();
});
$('#reset').onclick = () => { pick = {}; save(); draw(); };
$('#copy').onclick = async () => {
  const yes = DATA.filter(c => pick[c.n] === 'yes'), no = DATA.filter(c => pick[c.n] === 'no');
  const txt = `要（${yes.length}）：${yes.map(c => `#${c.n} ${c.name}`).join('、') || '无'}\n不要（${no.length}）：${no.map(c => '#' + c.n).join(' ') || '无'}`;
  try { await navigator.clipboard.writeText(txt); toast('已复制，直接粘贴发给我'); }
  catch (e) { prompt('复制下面这段发给我：', txt); }
};
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
draw();
</script>
</body>
</html>
