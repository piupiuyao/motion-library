<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选动效审核</title>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1b1b1d; --mute:#6d6d73; --line:#e4e2dc; --chip:#efede8;
          --yes:#2f6b3a; --yes-soft:#e3efe2; --no:#a33a2c; --no-soft:#f6e3df; --warn:#8a6a1f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#141416; --panel:#1d1d20; --ink:#ececee; --mute:#9a9aa2; --line:#2e2e33; --chip:#26262b;
    --yes:#9fd38f; --yes-soft:#24331f; --no:#f0a093; --no-soft:#3a221e; --warn:#e0c27a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 24px 12px; }
  h1 { margin:0; font-size:21px; }
  .sub { color:var(--mute); font-size:13px; margin:2px 0 10px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid transparent; background:var(--chip); color:var(--ink); border-radius:6px; padding:3px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .chip.on { border-color:var(--ink); background:var(--panel); font-weight:600; }
  .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  .tally { margin-left:auto; font-size:13px; color:var(--mute); }
  .tally b { color:var(--yes); }
  .btn { border:0; background:var(--ink); color:var(--bg); border-radius:8px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .btn.ghost { background:var(--chip); color:var(--ink); }
  main { padding:18px 24px 80px; max-width:1280px; margin:0 auto; }
  h2 { font-size:17px; margin:28px 0 4px; font-weight:700; }
  h3 { font-size:14px; color:var(--mute); margin:16px 0 10px; font-weight:600; }
  .chip.small { font-size:12px; padding:2px 8px; }
  .tag.good { color:var(--yes); background:var(--yes-soft); }
  .tag.rough { color:var(--no); background:var(--no-soft); }
  .tag.lib { color:var(--bg); background:var(--ink); }
  .card.lib { border-style:dashed; }
  .review { font-size:12.5px; color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card.yes { border-color:var(--yes); }
  .card.no { opacity:.5; }
  .thumb { aspect-ratio:16/9; background:var(--chip); position:relative; display:block; }
  .thumb img { position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:13px; padding:12px; text-align:center; }
  .thumb.vid { aspect-ratio:9/16; background:#000; }
  .thumb video { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .play { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.7); color:#fff; font-size:12px; padding:2px 8px; border-radius:5px; }
  .body { padding:10px 13px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .top { display:flex; align-items:baseline; gap:8px; }
  .num { font:600 13px ui-monospace,Menlo,monospace; color:var(--mute); }
  .name { font-weight:700; font-size:16px; }
  .diff { margin-left:auto; font-size:12px; padding:0 7px; border-radius:5px; background:var(--chip); white-space:nowrap; }
  .what { font-size:14px; }
  .use { font-size:13px; color:var(--mute); }
  .note { font-size:12.5px; color:var(--mute); background:var(--chip); border-radius:6px; padding:4px 8px; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag { font-size:11.5px; border-radius:4px; padding:0 6px; background:var(--chip); color:var(--mute); }
  .tag.warn { color:var(--warn); }
  .src { font-size:12.5px; display:flex; gap:8px; flex-wrap:wrap; }
  .src a { color:var(--mute); }
  .act { display:flex; gap:8px; margin-top:auto; padding-top:6px; }
  .act button { flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:6px; font:inherit; font-size:14px; cursor:pointer; }
  .card.yes .act .y { background:var(--yes-soft); border-color:var(--yes); color:var(--yes); font-weight:600; }
  .card.no .act .n { background:var(--no-soft); border-color:var(--no); color:var(--no); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:680px) { header{position:static;padding:12px 16px} main{padding:12px 16px 60px} .grid{grid-template-columns:1fr} .tally{margin-left:0;width:100%} }
</style>
</head>
<body>
<header>
  <h1>候选动效审核</h1>
  <div class="sub">候选 <span id="total"></span> 条 + 库里已有 <span id="libn"></span> 条，按「大类 → 小类」排。每条都是我们用同一段口播做的演示，鼠标放上去播放，点一下出声；想看原出处点来源链接。「自审」标签是我们对照原出处检查后的结论：<b>像</b>＝看得出是原版，<b>差不多</b>＝意思对、细节不同，<b>粗糙</b>＝只是个草样。候选每条点「要」或「不要」，选完点「复制结果」发给我；选择自动存在这个浏览器里。</div>
  <div class="bar" id="cats"></div>
  <div class="bar" id="subs" style="margin-top:6px"></div>
  <div class="bar" style="margin-top:8px">
    <span id="views"></span>
    <span class="tally" id="tally"></span>
    <button class="btn ghost" id="reset">清空选择</button>
    <button class="btn" id="copy">复制结果</button>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

"", "preview": "file:///Users/piupiuyao/motion-library/candidates/effects/c78/preview.mp4", "poster": "file:///Users/piupiuyao/motion-library/candidates/effects/c78/poster.jpg", "sub": "片头"}, {"n": 79, "id": "c79", "name": "光标点关注", "category": "片头片尾", "what": "一个「关注/点赞」按钮弹出，鼠标或手指滑过来点一下，按钮变成「已关注」或变红，炸一下消失", "use": "中途或结尾的行动号召「关注看下集」", "needs": ["音效"], "difficulty": "easy", "sources": ["https://elements.envato.com/subscribe-elements-YZPLXTK"], "note": "", "img": "https://elements-resized.envatousercontent.com/elements-video-cover-images/files/677984047/Preview%202K.png?w=1200&h=630&cf_fit=crop&q=85&format=jpeg&s=c5d855a76b8ecf61d467614a32016ba549078808e32da814e8008239a1563aba", "preview": "file:///Users/piupiuyao/motion-library/candidates/effects/c79/preview.mp4", "poster": "file:///Users/piupiuyao/motion-library/candidates/effects/c79/poster.jpg", "sub": "片尾"}, {"n": 80, "id": "c80", "name": "逐词上滑字幕", "category": "字体", "what": "下巴下方一行 3–4 个词的白色粗体字幕，每个词单独从下方约 40px 处往上滑到位并从透明变实（每个词动画 0.6 秒，相邻词间隔很短、几乎连着出），一整行出完停住，下一句整行换掉。词与词挨得较紧、整行居中。可以叠第二行更小的字（教程里叫 Real Estate Captions）放在下面。字在人前面，不压脸。", "use": "任何口播句子都能用，适合节奏快、想让字幕本身有动感但不抢戏的视频", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=Q04FF5KZyt4&t=408s"], "note": "Patrik Key 的 10 种爆款字幕教程之一，CapCut「slide up」动画；和现有 c11/c12 静态样式不同，是逐词入场", "ref_moment": "6:48–7:45（Multiple Word Slide Up 段，7:40 左右有和第二行组合后的成品）", "batch": 2, "sub": "逐词动态字幕"}, {"n": 81, "id": "c81", "name": "逐词弹跳字幕", "category": "字体", "what": "一句话拆成一个个词，按说话节奏一个词一个词「弹」出来：每个词从约 0 放大到略大于原尺寸再回落到 100%（pop，0.8 秒内完成，回弹明显），出现的那一帧之前完全不可见（教程用透明度关键帧把弹出前的底部残影去掉）。白色粗体、下巴下方居中，同屏累积 3–4 个词后整句清掉。", "use": "情绪强、语速快的句子；想要比上滑更活泼、更「蹦」的字幕", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=Q04FF5KZyt4&t=607s"], "note": "同上 Patrik Key 教程；与逐词上滑的区别在动作：放大回弹而不是位移", "ref_moment": "10:07–11:00（Pop Animated Captions 段）", "batch": 2, "sub": "逐词动态字幕"}, {"n": 82, "id": "c82", "name": "当前词变色大字幕", "category": "字体", "what": "Hormozi 式字幕：画面中下部每次只显示 2–4 个词，全大写、超粗无衬线（类似 Montserrat Black/Komika），白字加黑色粗描边和投影；正在说的那个词变成亮黄或亮绿，并瞬间放大约 110–120% 再回落，其余词保持白色。词组按说话节奏整组切换，没有过渡。字在人前面。", "use": "干货/观点类口播，每一句都想让观众跟着读，尤其是商业、励志类", "needs": [], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=HdbPgh_OEmE&t=37s"], "note": "Alex Hormozi 带火的字幕样式，Submagic/CapCut 都有预设，短视频里最常见的字幕之一；是否要单独开「逐词动态字幕」子类见报告", "ref_moment": "0:37–1:20（用 Submagic 生成的 Hormozi 字幕成品演示）", "batch": 2, "sub": "逐词动态字幕"}, {"n": 83, "id": "c83", "name": "翻牌数字", "category": "字体", "what": "一排深灰/黑色的机场翻牌格子（每格一个字符，格子中间有一条横缝，上下半片略有明暗差），格子里的字符从随机字母/数字快速上下翻片，逐格依次停到目标值（如 2024、$5,000、70%），整排从左到右陆续定住，约 1–2 秒。格子放在人胸前或画面上半空白处，在人前面，带一点投影。", "use": "报年份、价格、排名、关键数字揭晓的句子：「答案是……」", "needs": ["数字"], "difficulty": "medium", "sources": ["https://elements.envato.com/split-flap-titles-maker-STUBSCC", "https://www.youtube.com/watch?v=7U5iJC3c1Bc&t=5s"], "note": "Envato/Motion Array 上的翻牌标题模板；口播里不算最常见，但和 c02 滚动计数是明显不同的数字动画（翻片 vs 滚动）", "ref_moment": "Motion Array 预览视频 0:05–0:40（整段都是翻牌效果演示）", "batch": 2, "sub": "数字强调"}, {"n": 84, "id": "c84", "name": "圆环倒计时", "category": "字体", "what": "画面中央（或人一侧）一个细线圆环：底下是一圈灰色环，上面一圈亮色（蓝）环随时间顺时针被「吃掉」，圆环中间是正在递减的大数字（10、9、8…），细圆体字。整圈走完正好倒数到 0。圆环在人前面，可半透明。", "use": "「给你 10 秒想一想」「3 个步骤」「倒数」、限时、等待感的句子；也可做百分比环", "needs": ["数字"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=H6nWHe0D36I&t=453s"], "note": "Zeven 7「7 个 CapCut 效果」之一；与 c02 计数不同在于有环形进度", "ref_moment": "7:33–9:10（Timer Ring 段，结尾有成品）", "batch": 2, "sub": "数字强调"}, {"n": 85, "id": "c85", "name": "加载条百分比", "category": "字体", "what": "一条横向圆角长条：白色底条，上面一条绿色条从左往右填充，旁边/上方的百分比数字同步从 0% 跳到目标值（如 87%），填满时轻微弹一下。长条放在人胸前或脸下方，宽约屏幕 60%，在人前面。", "use": "「完成度」「进度」「还差一点」「X% 的人」这种带比例或阶段的句子", "needs": ["数字"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=Ri9gUz9iNto&t=140s"], "note": "Patrik Key 教程，原话称它是制造「后面有东西要来」的心理触发；和 c49（整条视频的进度条）不同，这是一句话里的数字条", "ref_moment": "2:20–4:37（Loading Bar 段）", "batch": 2, "sub": "数字强调"}, {"n": 86, "id": "c86", "name": "字体快速轮换", "category": "字体", "what": "一个关键词停在原位不动，但它的字体每 2–3 帧换一次（衬线→手写→等宽→粗黑→像素…），持续约 0.5–1 秒，像在「洗牌」，最后落回原来的字体停住。颜色大小基本不变，可配滴答声。词在人前或人后均可。", "use": "强调一个概念/名字，想让它「闪」一下吸引注意；开场钩子里的关键词", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=WNS-n_O21TQ&t=678s"], "note": "Matt Loui「10 个爆款 CapCut 文字效果」，原话说这效果在社媒上到处都是", "ref_moment": "11:18–12:03（Font Shift Effect 段）", "batch": 2, "sub": "文字节奏快闪"}, {"n": 87, "id": "c87", "name": "闪烁出字", "category": "字体", "what": "一行字出现时不是渐显，而是像接触不良的灯管一样闪：透明度在 0 和 100% 之间逐帧来回跳 6 次左右（约 0.2–0.3 秒），然后稳定亮着。常配渐变色字或发光。可以连续几个词各自闪着出。", "use": "悬念句、反转句、科技/神秘感的标题", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=WNS-n_O21TQ&t=330s", "https://www.youtube.com/watch?v=Q04FF5KZyt4&t=823s"], "note": "两位 CapCut 教程作者都单列了这个效果", "ref_moment": "Matt Loui 5:30–6:52（Flicker Text Effect）；Patrik Key 13:43–14:13（Flicker Effect）", "batch": 2, "sub": "文字节奏快闪"}, {"n": 88, "id": "c88", "name": "文字绕人旋转", "category": "字体", "what": "一圈文字（如一句标语重复两遍）像腰带一样水平绕着人的胸口/头部转：前半圈的字在人前面、后半圈被人身体挡住，整圈有透视（前面的字大、后面的字小且稍暗），匀速旋转一圈约 3–4 秒。白色或品牌色粗体。", "use": "品牌名、口号、话题标签；开场介绍自己或产品时", "needs": ["抠像"], "difficulty": "hard", "sources": ["https://www.youtube.com/watch?v=fpJdfEcuGe0&t=30s"], "note": "CapCut「rolling text」做法；参考里是绕物体，口播里用于绕人是同一做法，需前后半圈分层 + 抠像遮挡", "ref_moment": "0:30–3:30（教程用的是绕杯子转的 rolling text，方法同样用于人）", "batch": 2, "sub": "文字和人穿插"}, {"n": 89, "id": "c89", "name": "人走过显字", "category": "字体", "what": "大字一开始看不见，随着人（或人的手/身体）从画面一侧移到另一侧，人经过的地方文字被「擦」出来，像字一直藏在人背后、被人带出来；字始终在人后面。显出过程跟人的位置同步，约 1–2 秒。", "use": "人侧身、挥手或走动时引出一个标题；开场", "needs": ["抠像"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=lINZBP0skrE&t=146s"], "note": "duekneel 的 CapCut 教程；需要人有横向动作，可以用抠像轮廓的最右边缘位置作为擦除线", "ref_moment": "2:26–2:34（最终成品），做法在 0:00–2:26", "batch": 2, "sub": "文字和人穿插"}, {"n": 90, "id": "c90", "name": "描边字透过人", "category": "字体", "what": "人后面放一个大号实心字（彩色），同一个字的空心描边版本叠在人前面、位置完全重合。结果：没被人挡住的地方看到实心字，被人挡住的地方看到一层细描边从人身上透出来，像能「看穿」人。", "use": "开场大标题、品牌名、和 text_sandwich 交替使用增加变化", "needs": ["抠像"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=WNS-n_O21TQ&t=723s"], "note": "Matt Loui 提到这是 Jihad 的 reel，5.1 万赞；和 text_sandwich 的区别是人身上多一层描边", "ref_moment": "12:03–13:40（Outline Reveal Effect）", "batch": 2, "sub": "文字和人穿插"}, {"n": 91, "id": "c91", "name": "圆形人头角落", "category": "版式", "what": "反过来的画中画：截图/录屏/B-roll 铺满全屏，说话的人缩进左下或右下角一个圆形里（直径约屏宽 30%，带白色或彩色描边和投影），圆形从全屏人像缩小飞到角落，讲完再放大回来。", "use": "边讲边展示屏幕、软件、网页、证据的段落", "needs": ["图片", "视频"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=bHmYXC1Yow4&t=0s"], "note": "Cory Malveaux，教程/评测类短视频常见；和 c38 不同：人变小，素材变全屏", "ref_moment": "0:00–0:20 开头就是这个效果（作者自己的教程视频格式）", "batch": 2, "sub": "画中画/弹窗"}, {"n": 92, "id": "c92", "name": "电脑窗口弹窗", "category": "版式", "what": "一个 macOS 风格的窗口（顶部浅灰标题栏 + 左上角红黄绿三个圆点、圆角、阴影）从小放大弹出在画面上半部，窗口里放截图/网页/视频；可以连续弹 2–3 个窗口错位叠起来，最后一起缩回消失。人在下方保持全屏。", "use": "提到某个网站、软件、文章、搜索结果时", "needs": ["图片"], "difficulty": "easy", "sources": ["https://elements.envato.com/computer-popup-window-8F37VTH"], "note": "只找到模板页（Apple Motion/FCP 模板），口播中「浏览器窗口弹出」很常见，但没找到带时间点的真实口播示例；和 c38 区别是有系统窗口外观并可叠多个", "ref_moment": "Envato 预览视频全程", "batch": 2, "sub": "画中画/弹窗"}, {"n": 93, "id": "c93", "name": "背景压暗人保持亮", "category": "版式", "what": "背景变暗（叠一层约 60–80% 不透明的黑），但抠出来的人保持原亮度，看起来人从暗背景里浮出来；同时在人身后（压暗层之上、人之下）放大字或图形。进入和退出都是 0.3 秒淡入淡出。", "use": "关键结论、要放一句大字或图表又不想挡人的时候", "needs": ["抠像"], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=pkyDzEHpZao&t=35s"], "note": "Matt Loui 原话：reels 和 TikTok 上到处都用，他自己好几个爆款用过；和 c46 区别：人不虚化不变暗、卡片在人后面", "ref_moment": "0:35–2:08（Darken Background 段）", "batch": 2, "sub": "压暗聚焦卡"}, {"n": 94, "id": "c94", "name": "液态玻璃卡", "category": "版式", "what": "苹果 iOS 新设计风格的玻璃框：一个大圆角矩形（圆角约 25%）白色 75% 半透明，框内的画面被模糊扭曲（毛玻璃 + 边缘有折射弯曲），框里放白字或图标；框从小到大弹出并略有漂浮，人和背景透过玻璃可见。", "use": "放定义、要点、一句金句；科技、产品、苹果相关话题", "needs": [], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=oXV3eZMq3n8&t=0s"], "note": "Zephyr 教程（2.8 万播放），2025 年苹果 Liquid Glass 后流行；浏览器里用 backdrop-filter + SVG 位移滤镜能做出折射边", "ref_moment": "0:00–0:10 开头成品，做法 0:10–2:12", "batch": 2, "sub": "压暗聚焦卡"}, {"n": 95, "id": "c95", "name": "文字跟着脸走", "category": "镜头特效", "what": "一行文字/贴纸（如「100K subscribers」）钉在人脸旁边，人左右上下晃动时文字跟着同样移动，像粘在头上；不跟着缩放旋转，只跟位置。", "use": "给人加标签、身份、情绪标注；人动得多的口播", "needs": ["抠像"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=KVws1GVHoA0&t=576s", "https://www.youtube.com/watch?v=Ri9gUz9iNto&t=591s"], "note": "浏览器里可以用抠像蒙版的人头区域质心逐帧算位置来跟", "ref_moment": "Matt Loui 9:36–10:20（Tracking）；Patrik Key 9:51–10:50（Tracking Subject）", "batch": 2, "sub": "跟动作走"}, {"n": 96, "id": "c96", "name": "跟踪引线标签", "category": "镜头特效", "what": "人/物体上一个小圆点，从圆点拉出一条折线（先斜后平）到一边，线的末端文字从左往右擦出来，带下划线；整个圆点 + 线 + 字跟着被指的东西移动。白色线和字，线画出约 0.4 秒。", "use": "指出画面里的某个东西：「我手上这个」「这件衣服」「这个人」", "needs": ["抠像"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=LLjtp-7C1xM&t=114s"], "note": "Himel 356 的 CapCut 教程；和 c19（静态引线标注）不同在于跟着动", "ref_moment": "0:00–1:50 做引线动画，1:54 起加跟踪，结尾 2:00 左右成品", "batch": 2, "sub": "跟动作走"}, {"n": 97, "id": "c97", "name": "半调网点", "category": "镜头特效", "what": "画面变成报纸/漫画印刷的网点效果：亮的地方点小、暗的地方点大，通常单色（黑点 + 米白/彩色底），可以只给背景做网点、人保持原样，或者在重音时整屏网点闪一下并轻微抖动。", "use": "复古、漫画感、标题出现时的重音；做人后面的背景质感", "needs": ["抠像"], "difficulty": "medium", "sources": ["https://www.youtube.com/watch?v=1qx118g3psM&t=0s", "https://www.youtube.com/watch?v=lURCwwwy4MM&t=0s"], "note": "CapCut 教程作者 nishi、TR EDITZ；没找到口播创作者带时间点的示例，多见于剪辑向账号", "ref_moment": "两条都是开头展示成品（nishi 0:00–0:20；TR EDITZ 0:00–0:15 是网点背景 + 人后水印大字）", "batch": 2, "sub": "质感滤镜"}, {"n": 98, "id": "c98", "name": "漏光光斑叠加", "category": "镜头特效", "what": "黑白或低饱和的口播画面上，叠一层暖橙/金色的镜头光晕：一团柔光从画面一角缓慢飘过，带几个六边形光斑，用「滤色/叠加」混合，持续整段或 2–4 秒；四周加暗角。", "use": "讲故事、回忆、情绪段落；想要电影感时", "needs": [], "difficulty": "easy", "sources": ["https://www.youtube.com/watch?v=TnOP0z0EwoM&t=120s"], "note": "Trevor Jones「像 Alex Hormozi 一样剪」；和 c69 漏光转场不同，这是持续叠加的质感", "ref_moment": "2:00–2:56（How to add light flares），前面 0:24–1:35 是黑白   if (c.preview) return `<div class="thumb vid"><video muted loop playsinline preload="none" poster="${esc(c.poster || '')}" data-src="${esc(c.preview)}"></video><span class="play">我们做的演示 · 悬停播放</span></div>`;
  const y = c.sources.map(ytId).find(Boolean);
  const first = c.sources[0];
  if (y) {
    const u = c.sources.find(s => ytId(s) === y);
    const t = (u.match(/[?&]t=(\d+)/) || [])[1];
    return `<a class="thumb" href="${esc(u)}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${y}/mqdefault.jpg" loading="lazy" alt="">
      <span class="play">▶ ${t ? Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') + ' 起' : 'YouTube'}</span></a>`;
  }
  if (c.img) return `<a class="thumb" href="${esc(first)}" target="_blank" rel="noopener"><img src="${esc(c.img)}" loading="lazy" alt="" referrerpolicy="no-referrer"
      onerror="this.remove()"><span class="ph" style="z-index:-1">点这里打开 ${esc(host(first))}</span><span class="play">${esc(host(first))}</span></a>`;
  return `<a class="thumb" href="${esc(first)}" target="_blank" rel="noopener"><span class="ph">没有缩略图<br>点这里打开 ${esc(host(first))}</span></a>`;
}
function card(c) {
  const p = c.lib ? 'lib' : (pick[c.n] || '');
  const rv = c.review && RV[c.review.status];
  const weak = /来源只|只看了|只看到|第三方/.test(c.note);
  return `<div class="card ${p}" data-n="${c.n}">
    ${thumb(c)}
    <div class="body">
      <div class="top">${c.lib ? '' : `<span class="num">#${c.n}</span>`}<span class="name">${esc(c.name)}</span>${c.lib ? '<span class="diff tag lib">已入库</span>' : `<span class="diff">${DIFF[c.difficulty]}</span>`}</div>
      <div class="what">${esc(c.what)}</div>
      <div class="use">适合：${esc(c.use)}</div>
      <div class="tags"><span class="tag">${esc(c.sub)}</span>${rv ? `<span class="tag ${rv[1]}">自审：${rv[0]}</span>` : ''}${c.batch === 2 ? '<span class="tag">第二批</span>' : ''}${c.needs.map(x => `<span class="tag">要${esc(x)}</span>`).join('')}${weak ? '<span class="tag warn">⚠️ 来源较弱</span>' : ''}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}
      ${c.review && c.review.left ? `<div class="review">还差：${esc(c.review.left)}</div>` : ''}
      <div class="src">${c.sources.map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener">来源${i + 1} · ${esc(host(s))}</a>`).join('')}</div>
      ${c.lib ? '' : '<div class="act"><button class="y">要</button><button class="n">不要</button></div>'}
    </div></div>`;
}
function draw() {
  $('#cats').innerHTML = CATS.map(c => {
    const n = c === '全部' ? DATA.length : DATA.filter(x => x.category === c).length;
    return `<button class="chip ${st.cat === c ? 'on' : ''}" data-cat="${c}">${c} ${n}</button>`;
  }).join('');
  const subs = st.cat === '全部' ? [] : [...new Set(DATA.filter(x => x.category === st.cat).map(x => x.sub))];
  $('#subs').innerHTML = subs.length ? [['', '全部小类'], ...subs.map(k => [k, k])].map(([k, l]) =>
    `<button class="chip small ${st.sub === k ? 'on' : ''}" data-sub="${esc(k)}">${esc(l)} ${k ? DATA.filter(x => x.category === st.cat && x.sub === k).length : ''}</button>`).join('') : '';
  $('#views').innerHTML = VIEWS.map(([k, l]) => `<button class="chip ${st.view === k ? 'on' : ''}" data-view="${k}">${l}</button>`).join(' ');
  const yes = CAND.filter(c => pick[c.n] === 'yes').length, no = CAND.filter(c => pick[c.n] === 'no').length;
  $('#tally').innerHTML = `要 <b>${yes}</b> · 不要 ${no} · 未选 ${CAND.length - yes - no}`;
  const list = DATA.filter(c => (st.cat === '全部' || c.category === st.cat) && (!st.sub || c.sub === st.sub) &&
    (st.view === 'all' || (st.view === 'lib' ? c.lib : !c.lib && (st.view === 'todo' ? !pick[c.n] : pick[c.n] === st.view))));
  const cats = CATS.slice(1).filter(k => list.some(c => c.category === k));
  $('#main').innerHTML = cats.map(k => {
    const inCat = list.filter(c => c.category === k);
    return `<h2>${k}</h2>` + [...new Set(inCat.map(c => c.sub))].map(sb =>
      `<h3>${esc(sb)}</h3><div class="grid">${inCat.filter(c => c.sub === sb).map(card).join('')}</div>`).join('');
  }).join('')
    || '<p style="color:var(--mute)">这里没有条目。</p>';
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.cat) { st.cat = b.dataset.cat; st.sub = ''; draw(); return; }
  if (b.dataset.sub != null) { st.sub = b.dataset.sub; draw(); return; }
  if (b.dataset.view) { st.view = b.dataset.view; draw(); return; }
  const cardEl = b.closest('.card');
  if (cardEl && (b.classList.contains('y') || b.classList.contains('n'))) {
    const n = cardEl.dataset.n, v = b.classList.contains('y') ? 'yes' : 'no';
    pick[n] = pick[n] === v ? undefined : v; if (!pick[n]) delete pick[n];
    save(); draw();
  }
});
document.addEventListener('mouseover', ev => {
  const t = ev.target.closest('.thumb.vid'); if (!t) return;
  const v = t.querySelector('video'); if (!v.src) v.src = v.dataset.src; v.play().catch(() => {});
});
document.addEventListener('mouseout', ev => {
  const t = ev.target.closest('.thumb.vid'); if (!t || t.contains(ev.relatedTarget)) return;
  t.querySelector('video').pause();
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('.thumb.vid'); if (!t) return;
  const v = t.querySelector('video'); if (!v.src) v.src = v.dataset.src; v.muted = false; v.paused ? v.play() : v.pause();
});
$('#reset').onclick = () => { pick = {}; save(); draw(); };
$('#copy').onclick = async () => {
  const yes = CAND.filter(c => pick[c.n] === 'yes'), no = CAND.filter(c => pick[c.n] === 'no');
  const txt = `要（${yes.length}）：${yes.map(c => `#${c.n} ${c.name}`).join('、') || '无'}\n不要（${no.length}）：${no.map(c => '#' + c.n).join(' ') || '无'}`;
  try { await navigator.clipboard.writeText(txt); toast('已复制，直接粘贴发给我'); }
  catch (e) { prompt('复制下面这段发给我：', txt); }
};
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
draw();
</script>
</body>
</html>
