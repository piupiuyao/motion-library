<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动效库</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1b1b1d; --mute: #6d6d73; --line: #e4e2dc;
    --accent: #2f6b3a; --accent-soft: #e3efe2; --ref: #8a6a1f; --ref-soft: #f5ecd6; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1d1d20; --ink: #ececee; --mute: #9a9aa2; --line: #2e2e33;
      --accent: #9fd38f; --accent-soft: #24331f; --ref: #e0c27a; --ref-soft: #352c17; --chip: #26262b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px 24px 10px; }
  h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: -.01em; }
  .sub { color: var(--mute); font-size: 13px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tab small { opacity: .65; margin-left: 4px; }
  .filters { display: grid; gap: 6px; }
  .frow { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .flabel { color: var(--mute); font-size: 12px; width: 60px; flex: none; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 6px; padding: 2px 9px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip .n { color: var(--mute); font-size: 11px; margin-left: 3px; }
  .tools { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 160px; max-width: 320px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
  .count { color: var(--mute); font-size: 13px; }
  .clear { color: var(--accent); background: none; border: 0; cursor: pointer; font: inherit; font-size: 13px; }
  main { padding: 18px 24px 60px; }
  .sect { margin: 8px 0 12px; font-size: 14px; color: var(--mute); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .12s; }
  .card:hover { transform: translateY(-2px); }
  .thumb { position: relative; aspect-ratio: 9 / 16; background: #000; }
  .launch .thumb { aspect-ratio: 16 / 10; }
  .thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb video { opacity: 0; transition: opacity .15s; }
  .card:hover .thumb video.ready { opacity: 1; }
  .badge { position: absolute; left: 8px; top: 8px; font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
  .badge.ref { background: var(--ref-soft); color: var(--ref); }
  .meta { padding: 9px 11px 11px; }
  .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; color: var(--mute); background: var(--chip); border-radius: 4px; padding: 0 5px; }
  .empty { color: var(--mute); padding: 40px 0; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  .dlg { display: grid; grid-template-columns: 300px 1fr; }
  .dlg .media { background: #000; display: flex; align-items: center; }
  .dlg .media video, .dlg .media img { width: 100%; display: block; }
  .dlg .body { padding: 20px 22px 22px; overflow: auto; max-height: calc(100vh - 40px); }
  .dlg h2 { margin: 0 0 4px; font-size: 20px; }
  .dlg .id { font: 12px ui-monospace, Menlo, monospace; color: var(--mute); }
  .dlg h3 { font-size: 13px; color: var(--mute); margin: 16px 0 6px; font-weight: 600; }
  .dlg ul { margin: 0; padding-left: 18px; }
  .dlg code { font: 12px ui-monospace, Menlo, monospace; background: var(--chip); padding: 0 4px; border-radius: 4px; }
  .kv { display: grid; grid-template-columns: 72px 1fr; gap: 4px 10px; font-size: 14px; margin-top: 10px; }
  .kv span:nth-child(odd) { color: var(--mute); }
  .alts { display: flex; gap: 10px; flex-wrap: wrap; }
  .alt { width: 96px; cursor: pointer; font-size: 12px; }
  .alt img { width: 96px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; display: block; background: #000; }
  .alt .why { color: var(--mute); font-size: 11px; }
  .x { position: absolute; right: 12px; top: 10px; border: 0; background: var(--chip); color: var(--ink); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  a { color: var(--accent); }
  @media (max-width: 680px) {
    header { position: static; }
    header, main { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .dlg { grid-template-columns: 1fr; }
    .dlg .media video, .dlg .media img { max-height: 46vh; object-fit: contain; }
    .flabel { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>动效库</h1>
  <div class="sub">每个动效用同一段口播演示。鼠标放上去播放，点开看参数和可以替换的动效。</div>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="搜名字、描述…">
    <span class="count" id="count"></span>
    <button class="clear" id="clear">清空筛选</button>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<script src="data.js"></script>
<script>
const { tags: TAGS, types: TYPES, entries: ALL } = window.LIB;
const FACETS = [['purpose', '句子用途'], ['style', '风格'], ['weight', '分量'], ['face', '挡脸'], ['zone', '位置'], ['group', '组'], ['needs', '前提'], ['needs_assets', '素材'], ['category', '类别']];
const FACE = { '不挡脸': '脸一直露着', '挡脸': '脸被盖住、虚化或缩进小窗' };
const STATUS = { ready: '能出片', reference: '参考' };
const state = { type: 'talking-head', q: '', sel: {} };
const byId = Object.fromEntries(ALL.map(e => [e.id, e]));
const $ = s => document.querySelector(s);
const vals = (e, k) => k === 'status' ? [e.status] : k === 'face' ? [e.covers_face ? '挡脸' : '不挡脸'] : [].concat(e[k] || []);
const label = (k, v) => k === 'status' ? STATUS[v] : v;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const src = p => '../' + p;

function inType() { return ALL.filter(e => e.video_type === state.type); }
function match(e, skip) {
  for (const [k] of FACETS) {
    if (k === skip) continue;
    const s = state.sel[k];
    if (s && s.size && !vals(e, k).some(v => s.has(v))) return false;
  }
  if (state.q) {
    const hay = [e.name, e.id, e.was, e.what, e.why, e.steal, e.group, ...[].concat(e.use_for || [])].join(' ').toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function drawTabs() {
  const types = Object.keys(TAGS.video_type).filter(t => ALL.some(e => e.video_type === t));
  $('#tabs').style.display = types.length > 1 ? '' : 'none';
  $('#tabs').innerHTML = types.map(t => {
    const n = ALL.filter(e => e.video_type === t).length;
    return `<button class="tab ${t === state.type ? 'on' : ''}" data-t="${t}">${esc(TYPES[t] || t)}<small>${n}</small></button>`;
  }).join('');
  $('#tabs').onclick = ev => {
    const b = ev.target.closest('.tab'); if (!b) return;
    state.type = b.dataset.t; state.sel = {}; draw();
  };
}

function drawFilters() {
  const pool = inType();
  $('#filters').innerHTML = FACETS.map(([k, name]) => {
    const dict = k === 'face' ? FACE : TAGS[k];
    const order = k === 'status' ? Object.keys(STATUS) : Object.keys(dict);
    const chips = order.map(v => {
      const n = pool.filter(e => match(e, k) && vals(e, k).includes(v)).length;
      const on = state.sel[k]?.has(v);
      if (!n && !on) return '';
      return `<button class="chip ${on ? 'on' : ''}" data-k="${k}" data-v="${esc(v)}" title="${esc(k === 'status' ? '' : dict[v])}">${esc(label(k, v))}<span class="n">${n}</span></button>`;
    }).join('');
    return chips ? `<div class="frow"><span class="flabel">${name}</span>${chips}</div>` : '';
  }).join('');
}
$('#filters').onclick = ev => {
  const c = ev.target.closest('.chip'); if (!c) return;
  const s = state.sel[c.dataset.k] ||= new Set();
  s.has(c.dataset.v) ? s.delete(c.dataset.v) : s.add(c.dataset.v);
  draw();
};

function card(e) {
  const tags = [e.weight, e.group, ...(e.purpose || []).slice(0, 2)].filter(Boolean);
  return `<div class="card" data-id="${e.id}">
    <div class="thumb">
      ${e._poster ? `<img src="${src(e._poster)}" loading="lazy" alt="">` : ''}
      ${e._preview ? `<video muted loop playsinline preload="none" data-src="${src(e._preview)}"></video>` : ''}
    </div>
    <div class="meta"><div class="name">${esc(e.name)}</div>
      <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>
  </div>`;
}

function drawGrid() {
  const list = inType().filter(e => match(e));
  $('#count').textContent = `${list.length} 条`;
  const html = list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '';
  $('#main').innerHTML = html || '<div class="empty">没有符合的条目，换个筛选试试。</div>';
}

$('#main').addEventListener('mouseover', ev => {
  const c = ev.target.closest('.card'); if (!c) return;
  const v = c.querySelector('video'); if (!v) return;
  if (!v.src) { v.src = v.dataset.src; v.oncanplay = () => v.classList.add('ready'); }
  v.play().catch(() => {});
});
$('#main').addEventListener('mouseout', ev => {
  const c = ev.target.closest('.card'); if (!c || c.contains(ev.relatedTarget)) return;
  const v = c.querySelector('video'); if (v) v.pause();
});
$('#main').addEventListener('click', ev => {
  const c = ev.target.closest('.card'); if (c) openEntry(c.dataset.id);
});

function list(arr) { return arr && arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''; }
function openEntry(id) {
  const e = byId[id], d = $('#dlg'), s = e.source || {};
  const media = e._preview ? `<video src="${src(e._preview)}" ${e._poster ? `poster="${src(e._poster)}"` : ''} controls autoplay loop playsinline muted></video>`
              : e._poster ? `<img src="${src(e._poster)}" alt="">` : '';
  const fills = e.fills ? Object.entries(e.fills).map(([k, v]) => `<li><code>${esc(k)}</code> ${esc(v)}</li>`).join('') : '';
  const params = e.params ? Object.entries(e.params).map(([k, v]) => `<li><code>${esc(k)}</code> ${esc(v)}</li>`).join('') : '';
  const alts = (e._alt || []).map(a => {
    const x = byId[a.id];
    return `<div class="alt" data-id="${a.id}">${x._poster ? `<img src="${src(x._poster)}" alt="">` : ''}<div>${esc(x.name)}</div>
      <div class="why">${a.same_group ? '同组' : '同为' + esc(a.shared.join('、'))}</div></div>`;
  }).join('');
  d.innerHTML = `<button class="x" aria-label="关闭">×</button><div class="dlg">
    <div class="media">${media}</div>
    <div class="body">
      <h2>${esc(e.name)}</h2><div class="id">${esc(e.id)}${e.was ? ` · 原 ${esc(e.was)}` : ''} · ${esc(TYPES[e.video_type])}</div>
      <div class="kv">
        ${e.purpose?.length ? `<span>句子用途</span><span>${esc(e.purpose.join('、'))}</span>` : ''}
        ${e.style?.length ? `<span>风格</span><span>${esc(e.style.join('、'))}</span>` : ''}
        <span>分量</span><span>${esc(e.weight)}${e.covers_face ? '（挡脸）' : ''}</span>
        <span>位置</span><span>${esc(e.zone)}</span>
        <span>组</span><span>${esc(e.group)}</span>
        <span>前提</span><span>${esc((e.needs || []).join('、') || '—')}</span>
        <span>素材</span><span>${esc((e.needs_assets || []).join(' / ') || '不用准备')}</span>
        ${e.duration ? `<span>时长</span><span>${esc(e.duration)}</span>` : ''}
        <span>类别</span><span>${esc(e.category)}</span>
      </div>
      ${e.what ? `<h3>画面</h3><div>${esc(e.what)}</div>` : ''}
      ${e.why ? `<h3>好在哪</h3><div>${esc(e.why)}</div>` : ''}
      ${e.steal ? `<h3>可以借的</h3><div>${esc(e.steal)}</div>` : ''}
      ${e.use_for ? `<h3>用在什么句子</h3>${Array.isArray(e.use_for) ? list(e.use_for) : `<div>${esc(e.use_for)}</div>`}` : ''}
      ${fills ? `<h3>要从原话里填的参数</h3><ul>${fills}</ul>` : ''}
      ${e.layers ? `<h3>画面分层（从下到上）</h3>${list(e.layers)}` : ''}
      ${params ? `<h3>参数（写在 shots.json 里）</h3><ul>${params}</ul>` : ''}
      ${e.rule ? `<h3>注意</h3><div>${esc(e.rule)}</div>` : ''}
      ${alts ? `<h3>可以换成</h3><div class="alts">${alts}</div>` : ''}
      ${s.credit || s.from || s.note || s.url ? `<h3>灵感来源</h3><div>${esc(s.credit || s.from || '')}${s.note ? '：' + esc(s.note) : ''}${s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">原片</a>` : ''}</div>` : ''}
      ${e.sources?.length ? `<h3>参考来源</h3><ul>${e.sources.map(u => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ul>` : ''}
      <h3>文件</h3><div><code>${esc(e._dir)}</code></div>
    </div></div>`;
  d.querySelector('.x').onclick = () => d.close();
  d.querySelectorAll('.alt').forEach(a => a.onclick = () => openEntry(a.dataset.id));
  if (!d.open) d.showModal();
}
$('#dlg').addEventListener('click', ev => { if (ev.target.id === 'dlg') ev.target.close(); });
$('#dlg').addEventListener('close', () => { $('#dlg').innerHTML = ''; });

$('#q').oninput = ev => { state.q = ev.target.value.trim(); drawFilters(); drawGrid(); };
$('#clear').onclick = () => { state.sel = {}; state.q = ''; $('#q').value = ''; draw(); };
function draw() { drawTabs(); drawFilters(); drawGrid(); }
draw();
</script>
</body>
</html>
